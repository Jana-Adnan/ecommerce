<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6">
    <!-- Banner 1: Fresh Organic Fruits (Deal of the Day) -->
    <div
      class="relative overflow-hidden rounded-3xl p-6 sm:p-8 bg-gradient-to-r from-emerald-600 via-emerald-500 to-teal-500 text-white shadow-sm flex flex-col justify-between group"
    >
      <!-- Decorative background blur elements -->
      <div
        class="absolute -right-8 -bottom-8 w-48 h-48 bg-white/10 rounded-full blur-2xl pointer-events-none group-hover:scale-110 transition-transform duration-500"
      ></div>
      <div
        class="absolute right-6 top-6 w-24 h-24 bg-teal-400/20 rounded-full blur-xl pointer-events-none"
      ></div>

      <!-- Top Badge & Text Content -->
      <div class="relative z-10">
        <!-- Deal of the Day Tag -->
        <div class="inline-flex items-center gap-1.5 bg-black/20 backdrop-blur-xs text-white text-xs font-semibold px-3 py-1 rounded-full mb-3">
          <i class="fa-solid fa-bolt text-amber-300 text-xs"></i>
          <span>Deal of the Day</span>
        </div>

        <h3 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight leading-tight">
          Fresh Organic Fruits
        </h3>
        <p class="text-emerald-50/90 text-xs sm:text-sm mt-1 mb-6 font-normal">
          Get up to 40% off on selected organic fruits
        </p>
      </div>

      <!-- Discount & CTA Button -->
      <div class="relative z-10 mt-2">
        <div class="flex items-center gap-3 mb-4">
          <span class="text-2xl sm:text-3xl font-black text-white leading-none">
            40% OFF
          </span>
          <span
            class="text-[11px] font-mono tracking-wider bg-white/20 text-white px-2.5 py-1 rounded-md backdrop-blur-xs font-medium"
          >
            Use code: <span class="font-bold">ORGANIC40</span>
          </span>
        </div>

        <a
          routerLink="/shop"
          class="inline-flex items-center gap-2 bg-white text-emerald-700 hover:bg-emerald-50 font-bold px-5 py-2.5 rounded-full text-xs sm:text-sm shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer w-fit"
        >
          <span>Shop Now</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </a>
      </div>
    </div>

    <!-- Banner 2: Exotic Vegetables (New Arrivals) -->
    <div
      class="relative overflow-hidden rounded-3xl p-6 sm:p-8 bg-gradient-to-r from-orange-500 via-amber-500 to-rose-500 text-white shadow-sm flex flex-col justify-between group"
    >
      <!-- Decorative background blur elements -->
      <div
        class="absolute -right-8 -bottom-8 w-48 h-48 bg-white/10 rounded-full blur-2xl pointer-events-none group-hover:scale-110 transition-transform duration-500"
      ></div>
      <div
        class="absolute right-6 top-6 w-24 h-24 bg-rose-400/20 rounded-full blur-xl pointer-events-none"
      ></div>

      <!-- Top Badge & Text Content -->
      <div class="relative z-10">
        <!-- New Arrivals Tag -->
        <div class="inline-flex items-center gap-1.5 bg-black/20 backdrop-blur-xs text-white text-xs font-semibold px-3 py-1 rounded-full mb-3">
          <i class="fa-solid fa-star text-amber-200 text-xs"></i>
          <span>New Arrivals</span>
        </div>

        <h3 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight leading-tight">
          Exotic Vegetables
        </h3>
        <p class="text-orange-50/90 text-xs sm:text-sm mt-1 mb-6 font-normal">
          Discover our latest collection of premium vegetables
        </p>
      </div>

      <!-- Discount & CTA Button -->
      <div class="relative z-10 mt-2">
        <div class="flex items-center gap-3 mb-4">
          <span class="text-2xl sm:text-3xl font-black text-white leading-none">
            25% OFF
          </span>
          <span
            class="text-[11px] font-mono tracking-wider bg-white/20 text-white px-2.5 py-1 rounded-md backdrop-blur-xs font-medium"
          >
            Use code: <span class="font-bold">FRESH25</span>
          </span>
        </div>

        <a
          routerLink="/shop"
          class="inline-flex items-center gap-2 bg-white text-orange-600 hover:bg-orange-50 font-bold px-5 py-2.5 rounded-full text-xs sm:text-sm shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer w-fit"
        >
          <span>Explore Now</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </a>
      </div>
    </div>
  </div>
</section>
