<section class="relative min-h-[calc(100vh-140px)] flex items-center justify-center font-sans overflow-hidden bg-gradient-to-b from-emerald-50/40 via-white to-emerald-50/20 py-12 px-4 sm:px-6 lg:px-8">
  <!-- Subtle Background Floating Fruit / Veggie Icons -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden select-none" aria-hidden="true">
    <!-- Apple (Top Left) -->
    <div class="absolute top-12 left-10 md:left-24 text-emerald-400/20 transform -rotate-12 animate-float-slow">
      <svg class="w-14 h-14" viewBox="0 0 24 24" fill="currentColor">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 3.95c.61-.74 1.03-1.76.92-2.79-.89.04-1.98.6-2.61 1.34-.56.64-1.05 1.68-.92 2.69 1 .08 2.02-.51 2.61-1.24z"/>
      </svg>
    </div>

    <!-- Carrot (Middle Right) -->
    <div class="absolute top-1/4 right-8 md:right-28 text-emerald-400/20 transform rotate-45 animate-float-delay">
      <svg class="w-12 h-12" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.41 4.59a2 2 0 0 0-2.83 0L14.7 6.47l-.71-.71a1 1 0 0 0-1.41 1.41l.71.71-6.12 6.12a4 4 0 0 0-.91 1.5l-2.1 6.32a.5.5 0 0 0 .63.63l6.32-2.1a4 4 0 0 0 1.5-.91l6.12-6.12.71.71a1 1 0 0 0 1.41-1.41l-.71-.71 1.88-1.88a2 2 0 0 0 0-2.83z"/>
      </svg>
    </div>

    <!-- Lemon / Citrus (Bottom Left) -->
    <div class="absolute bottom-28 left-8 md:left-32 text-emerald-400/20 transform rotate-12 animate-float">
      <svg class="w-12 h-12" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.4z"/>
      </svg>
    </div>

    <!-- Sprout / Leaves (Bottom Right) -->
    <div class="absolute bottom-20 right-10 md:right-36 text-emerald-400/25 transform -rotate-6 animate-float-slow">
      <svg class="w-14 h-14" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 3C8.5 3 5.5 5.5 5 9c-.5 3.5 1.5 6.5 4.5 7.5L12 21l2.5-4.5c3-1 5-4 4.5-7.5-.5-3.5-3.5-6-7-6zm-1 9c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/>
      </svg>
    </div>
  </div>

  <!-- Central Content -->
  <div class="relative z-10 max-w-2xl mx-auto flex flex-col items-center text-center">
    <!-- Illustration Card -->
    <div class="relative mb-3">
      <!-- White Rounded Box -->
      <div class="w-32 h-32 sm:w-36 sm:h-36 bg-white rounded-3xl shadow-xl shadow-emerald-500/5 border border-emerald-50/80 flex items-center justify-center transition-transform duration-300 hover:scale-105">
        <!-- Shopping Cart Icon -->
        <i class="fa-solid fa-cart-shopping text-4xl sm:text-5xl text-emerald-500"></i>
      </div>

      <!-- 404 Green Badge (Overlapping Top-Right Corner) -->
      <div class="absolute -top-2.5 -right-2.5 w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-emerald-600 text-white font-extrabold text-xs sm:text-sm flex items-center justify-center shadow-lg shadow-emerald-600/30 ring-4 ring-white select-none">
        404
      </div>
    </div>


    <div class="flex items-center justify-center gap-1.5 mb-6 text-emerald-500 select-none" aria-hidden="true">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
      <svg class="w-6 h-3 text-emerald-500" viewBox="0 0 24 10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M3 2 C 8 9, 16 9, 21 2" />
      </svg>
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
    </div>

    <!-- Heading -->
    <h1 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold text-gray-900 tracking-tight mb-3">
      Oops! Nothing Here
    </h1>

    <!-- Subtitle -->
    <p class="text-gray-500 text-sm sm:text-base max-w-md mx-auto leading-relaxed mb-8">
      Looks like this page went out of stock! Don't worry,<br class="hidden sm:inline" />
      there's plenty more fresh content to explore.
    </p>

    <!-- Action Buttons -->
    <div class="flex flex-wrap items-center justify-center gap-3.5 mb-10">
      <!-- Go to Homepage Button -->
      <a
        routerLink="/home"
        class="inline-flex items-center justify-center gap-2.5 px-6 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-semibold text-sm transition-all duration-200 shadow-md shadow-emerald-600/20 hover:shadow-lg hover:shadow-emerald-600/30 hover:-translate-y-0.5"
      >
        <i class="fa-solid fa-house text-sm"></i>
        <span>Go to Homepage</span>
      </a>

      <!-- Go Back Button -->
      <button
        type="button"
        (click)="goBack()"
        class="inline-flex items-center justify-center gap-2.5 px-6 py-3 rounded-xl bg-white hover:bg-gray-50 active:bg-gray-100 text-gray-700 font-semibold text-sm border border-gray-200 hover:border-gray-300 transition-all duration-200 shadow-xs hover:-translate-y-0.5 cursor-pointer"
      >
        <i class="fa-solid fa-arrow-left text-sm"></i>
        <span>Go Back</span>
      </button>
    </div>

    <!-- Popular Destinations Container -->
    <div class="w-full max-w-xl bg-white/90 backdrop-blur-xs border border-gray-100 rounded-2xl py-4 px-6 sm:px-8 shadow-xs">
      <h2 class="text-[11px] font-bold text-gray-400 uppercase tracking-widest text-center mb-3">
        Popular Destinations
      </h2>
      <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-2.5">
        <!-- All Products (Highlighted) -->
        <a
          routerLink="/products"
          class="px-4 py-1.5 rounded-lg text-xs font-semibold bg-emerald-50 text-emerald-700 hover:bg-emerald-100/90 border border-emerald-100 transition-colors"
        >
          All Products
        </a>

        <!-- Categories -->
        <a
          routerLink="/categories"
          class="px-4 py-1.5 rounded-lg text-xs font-medium text-gray-600 bg-gray-100/80 hover:bg-emerald-50 hover:text-emerald-700 hover:border-emerald-100 border border-transparent transition-colors"
        >
          Categories
        </a>

        <!-- Today's Deals -->
        <a
          routerLink="/shop"
          class="px-4 py-1.5 rounded-lg text-xs font-medium text-gray-600 bg-gray-100/80 hover:bg-emerald-50 hover:text-emerald-700 hover:border-emerald-100 border border-transparent transition-colors"
        >
          Today's Deals
        </a>

        <!-- Contact Us -->
        <a
          routerLink="/support"
          class="px-4 py-1.5 rounded-lg text-xs font-medium text-gray-600 bg-gray-100/80 hover:bg-emerald-50 hover:text-emerald-700 hover:border-emerald-100 border border-transparent transition-colors"
        >
          Contact Us
        </a>
      </div>
    </div>
  </div>
</section>
